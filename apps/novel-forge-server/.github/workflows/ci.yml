name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: novel_forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Migrate database
        run: bun run db:migrate
        env:
          DATABASE_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/novel_forge_test

      - name: Create template DB
        run: bun run db:create-template
        env:
          DATABASE_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/novel_forge_test

      # shadow verify = format + lint + type-check + test; the suite needs the template database.
      - name: Verify
        run: bun run verify
        env:
          DATABASE_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/novel_forge_test

      - name: Build
        run: bun run build
