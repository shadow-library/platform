[project]
name = "novel-forge-deepeval"
version = "0.0.0"
description = "DeepEval judge for Novel Forge genre-craft cases"
requires-python = ">=3.11"
dependencies = [
  "deepeval==4.3.2",
  "openai==3.40.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 180
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
