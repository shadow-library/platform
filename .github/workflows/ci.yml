name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual re-run at any commit without needing a new push -- e.g. to re-verify main after an
  # infra-only flake, with no code change to trigger a fresh run otherwise.
  workflow_dispatch: {}

permissions:
  contents: read

# Superseded pushes to the same PR branch cancel their in-flight run. Main runs are never
# cancelled mid-flight; note the group still queues at most one pending main run, so a rapid
# burst of main pushes serializes and intermediate pending runs get superseded (loudly — the
# ci gate treats cancelled as failure).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Computes which workspaces a change actually touches, from a plain `git diff` against the
  # merge-base — not dorny/paths-filter — because the rule set below isn't a static path→label
  # table (an `apps/<x>/**` change must resolve to *that app's own workspace name*, and a
  # packages/**|scripts/**|root-config change must expand to *every* workspace enumerated from
  # the filesystem). That's a few lines of shell either way; doing it by hand avoids a
  # third-party action and keeps the whole selection rule in one auditable place.
  changes:
    name: Detect affected workspaces
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: merge-base and diff need to reach arbitrarily far back, especially for
          # `push` events where `github.event.before` can be an old commit.
          fetch-depth: 0

      - name: Detect affected workspaces
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          # No `-u`: an entirely-empty `declare -A SELECTED` (the legitimate "nothing affected"
          # outcome, e.g. a root-README-only change) trips bash's "unbound variable" on
          # `${#SELECTED[@]}` under `set -u` — a known bash gotcha, not a real bug here.
          set -eo pipefail

          # ---------------------------------------------------------------
          # 1. Resolve the diff range for this event.
          # ---------------------------------------------------------------
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
            HEAD_SHA="$PUSH_AFTER_SHA"
          fi

          ALL_CHANGED=false
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No usable base commit (new branch, force-push, or history rewrite) — treating every workspace as affected."
            ALL_CHANGED=true
            CHANGED_FILES=""
          else
            MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            CHANGED_FILES="$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA")"
            echo "Changed files (vs. merge-base $MERGE_BASE):"
            echo "$CHANGED_FILES"
          fi

          # ---------------------------------------------------------------
          # 2. Enumerate every workspace from the filesystem, not a
          #    hardcoded list, so a new app/package needs no workflow edit.
          # ---------------------------------------------------------------
          ALL_WORKSPACES=()
          for d in apps/*/; do ALL_WORKSPACES+=("apps/$(basename "$d")"); done
          for d in packages/*/; do ALL_WORKSPACES+=("packages/$(basename "$d")"); done
          ALL_WORKSPACES+=("e2e")
          # Not a workspace -- the root tooling (scripts/ + the root configs), which `verify.ts` accepts
          # as a target so the thing that verifies everything else is itself format/lint/type-checked.
          ALL_WORKSPACES+=("scripts")

          # ---------------------------------------------------------------
          # 3. Apply the affected-path rules:
          #      packages/**, scripts/**, or root config -> every workspace
          #      apps/<x>/**                              -> apps/<x> only
          #      e2e/**                                    -> e2e only
          # ---------------------------------------------------------------
          declare -A SELECTED
          if [ "$ALL_CHANGED" = true ]; then
            for w in "${ALL_WORKSPACES[@]}"; do SELECTED["$w"]=1; done
          else
            AFFECTS_ALL=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                packages/*|scripts/*|package.json|bun.lock|tsconfig.base.json|tsconfig.json|apps/tsconfig.server.json|apps/tsconfig.web.json|.prettierrc.json|eslint.config.ts|commitlint.config.ts|.github/workflows/ci.yml)
                  AFFECTS_ALL=true
                  ;;
                apps/*)
                  SELECTED["$(cut -d/ -f1,2 <<< "$f")"]=1
                  ;;
                e2e/*)
                  SELECTED["e2e"]=1
                  ;;
              esac
            done <<< "$CHANGED_FILES"

            if [ "$AFFECTS_ALL" = true ]; then
              for w in "${ALL_WORKSPACES[@]}"; do SELECTED["$w"]=1; done
            fi
          fi

          if [ "${#SELECTED[@]}" -eq 0 ]; then
            SELECTED_JSON='[]'
          else
            SELECTED_JSON="$(printf '%s\n' "${!SELECTED[@]}" | sort | jq -R . | jq -s .)"
          fi
          echo "Affected workspaces: $SELECTED_JSON"

          # ---------------------------------------------------------------
          # 4. The one piece of per-workspace CI metadata that isn't purely
          #    structural: which backends have a migrations check at all.
          #    Every apps/*-server has one except pulse-server, whose
          #    migrations are hand-managed via src/migrate.ts rather than
          #    `drizzle-kit generate` (check-migrations.ts requires a
          #    "db:generate" script and errors without one).
          # ---------------------------------------------------------------
          cat > /tmp/workspace-metadata.json <<'JSON'
          {
            "apps/identity-server": { "checkMigrations": true },
            "apps/novel-forge-server": { "checkMigrations": true },
            "apps/pulse-server": { "checkMigrations": false },
            "apps/memoir-server": { "checkMigrations": true },
            "apps/web-novel-server": { "checkMigrations": true }
          }
          JSON

          # ---------------------------------------------------------------
          # 5. Build matrix.include directly (one fully-specified object per
          #    affected workspace) instead of a plain `workspace` array plus
          #    a static `include:` block in the workflow. GitHub Actions
          #    folds any `include` entry that doesn't match an existing
          #    combination in as a *new* combination — with a static include
          #    keyed by workspace name, every unaffected workspace would
          #    silently reappear as its own job. Emitting the complete,
          #    pre-filtered list here sidesteps that entirely.
          #
          #    checkApiTypes is structural, not mined metadata: every
          #    apps/*-server and apps/*-web is paired one-to-one by naming
          #    convention, and the check is infra-free and fast (~0.7s per
          #    server), so both sides of every pair run it — a server leg
          #    checks its own paired web app, a web leg checks itself. That
          #    also covers a web-only hand edit of the committed
          #    api-types.gen.ts, which a server-legs-only check would miss.
          # ---------------------------------------------------------------
          MATRIX="$(jq -cn --argjson meta "$(cat /tmp/workspace-metadata.json)" --argjson selected "$SELECTED_JSON" '
            $selected | map(
              . as $w
              | ($meta[$w] // {}) as $m
              | {
                  workspace: $w,
                  checkMigrations: ($m.checkMigrations // false),
                  checkApiTypes: ($w | test("^apps/.*-(server|web)$"))
                }
            )
          ')"

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Resolved matrix:"
          echo "$MATRIX" | jq .

  # One job per affected workspace.
  verify:
    name: verify (${{ matrix.workspace }})
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # No max-parallel: the repo is public, where GitHub-hosted runners allow far more concurrent
      # jobs than this matrix ever produces — the full 18-leg fan-out runs in a single wave.
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Bun's global download cache, keyed on the lockfile — turns each job's install into mostly
      # cache-hits instead of registry downloads. restore-keys lets a lockfile change still start
      # from the previous cache rather than cold.
      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Package dists are content-cached under one key covering every input that can affect any
      # package's build output. On a hit the build is skipped entirely. On a miss the job builds
      # the FULL package set — not just this workspace's closure — so the cache saved under the
      # shared key is complete for every other job and run; a closure-only build here would poison
      # the key with a partial dist set.
      - name: Restore built package dists
        id: pkgdist
        if: matrix.workspace != 'scripts' && matrix.workspace != 'e2e'
        uses: actions/cache@v4
        with:
          path: packages/*/dist
          key: pkgdist-${{ runner.os }}-${{ hashFiles('packages/*/src/**', 'packages/*/package.json', 'packages/*/tsconfig*.json', 'packages/*/README.md', 'packages/tsconfig.lib.json', 'packages/tsconfig.build.json', 'bun.lock', 'package.json', 'tsconfig.base.json', 'types/**', 'scripts/**') }}

      - name: Build packages
        if: matrix.workspace != 'scripts' && matrix.workspace != 'e2e' && steps.pkgdist.outputs.cache-hit != 'true'
        run: bun scripts/build.ts 'packages/*'

      # `check-migrations.ts` only diffs `drizzle-kit generate`'s output against the committed
      # migrations directory — schema-to-file, no live database — so this needs no Postgres service.
      - name: Check migrations
        if: matrix.checkMigrations
        run: bun scripts/check-migrations.ts ${{ matrix.workspace }}

      # verify = format + lint + type-check + test. The test step runs only where the workspace opts in
      # via `"shadow": { "verifyTest": true }` in its own package.json — every apps/* and packages/*
      # library does today; e2e (a Playwright suite needing a live deployment) does not. `--ci` fails an
      # apps/* workspace's test step on any test over the 50ms hard cap instead of only warning.
      - name: Verify
        run: bun scripts/verify.ts ${{ matrix.workspace }} --ci

      # The server↔web API contract is not atomic (AGENTS.md) — a server DTO change with no matching
      # `api-types.gen.ts` regeneration in its paired web app, or a web-only hand edit of that
      # committed file, is a silent break nothing else here would catch. `gen-api-types.ts --check`
      # boots the relevant server through its `src/dump-openapi.ts` entry over fakes (no port, no dev
      # server, no Postgres/Redis/IdP) and only reads the web app's committed file — infra-free and
      # ~0.7s per server, so both a server leg (checking its own paired web app) and a web leg
      # (checking itself) run it unconditionally rather than skipping web-only changes.
      - name: Check API types
        if: matrix.checkApiTypes
        run: bun scripts/gen-api-types.ts "$(echo '${{ matrix.workspace }}' | sed 's/-server$/-web/')" --check

      - name: Build
        if: matrix.workspace != 'scripts'
        run: bun scripts/build.ts ${{ matrix.workspace }}

  # Single required-status-check target. A matrix job with zero legs (nothing affected) reports
  # as "skipped", not "success" — a required check pinned directly to `verify` would then hang
  # forever waiting for a status that will never post. This job always runs and normalizes that.
  ci:
    name: CI
    needs: [changes, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require verify to have succeeded or been legitimately skipped
        run: |
          result="${{ needs.verify.result }}"
          echo "verify result: $result"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            exit 1
          fi
