name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Main runs are never cancelled mid-flight, but the group keeps one pending run, so a burst of main pushes supersedes the intermediate ones
# (the ci gate treats cancelled as failure).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Plain `git diff` instead of dorny/paths-filter: apps/<x>/** must resolve to that app's workspace name and shared paths must expand
  # to every workspace found on the filesystem, which is not a static path-to-label table.
  changes:
    name: Detect affected workspaces
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # merge-base and diff must reach arbitrarily far back, as `github.event.before` on a push can be an old commit.
          fetch-depth: 0

      - name: Detect affected workspaces
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          # No `-u`: `${#SELECTED[@]}` on an empty `declare -A` ("nothing affected") trips bash's unbound-variable error.
          set -eo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
            HEAD_SHA="$PUSH_AFTER_SHA"
          fi

          ALL_CHANGED=false
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No usable base commit (new branch, force-push, or history rewrite) — treating every workspace as affected."
            ALL_CHANGED=true
            CHANGED_FILES=""
          else
            MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            CHANGED_FILES="$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA")"
            echo "Changed files (vs. merge-base $MERGE_BASE):"
            echo "$CHANGED_FILES"
          fi

          # Enumerated from the filesystem so a new app or package needs no workflow edit.
          ALL_WORKSPACES=()
          for d in apps/*/; do ALL_WORKSPACES+=("apps/$(basename "$d")"); done
          for d in packages/*/; do ALL_WORKSPACES+=("packages/$(basename "$d")"); done
          ALL_WORKSPACES+=("e2e")
          # Not a workspace: root tooling, which `verify.ts` accepts as a target so it is itself checked.
          ALL_WORKSPACES+=("scripts")

          # packages/**, scripts/** and root config change every workspace; apps/<x>/** only that app; e2e/** only e2e.
          # A new root config that verify or build reads must be added to the first pattern.
          declare -A SELECTED
          if [ "$ALL_CHANGED" = true ]; then
            for w in "${ALL_WORKSPACES[@]}"; do SELECTED["$w"]=1; done
          else
            AFFECTS_ALL=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                packages/*|scripts/*|package.json|bun.lock|tsconfig.base.json|tsconfig.json|apps/tsconfig.server.json|apps/tsconfig.web.json|.prettierrc.json|eslint.config.ts|commitlint.config.ts|.github/workflows/ci.yml)
                  AFFECTS_ALL=true
                  ;;
                apps/*)
                  SELECTED["$(cut -d/ -f1,2 <<< "$f")"]=1
                  ;;
                e2e/*)
                  SELECTED["e2e"]=1
                  ;;
              esac
            done <<< "$CHANGED_FILES"

            if [ "$AFFECTS_ALL" = true ]; then
              for w in "${ALL_WORKSPACES[@]}"; do SELECTED["$w"]=1; done
            fi
          fi

          if [ "${#SELECTED[@]}" -eq 0 ]; then
            SELECTED_JSON='[]'
          else
            SELECTED_JSON="$(printf '%s\n' "${!SELECTED[@]}" | sort | jq -R . | jq -s .)"
          fi
          echo "Affected workspaces: $SELECTED_JSON"

          # Per-workspace metadata that is not structural: checkMigrations opts a server into the migrations check,
          # and "checkApiTypes": false opts out a server whose paired web app does not exist yet.
          cat > /tmp/workspace-metadata.json <<'JSON'
          {
            "apps/identity-server": { "checkMigrations": true },
            "apps/novel-forge-server": { "checkMigrations": true },
            "apps/pulse-server": { "checkMigrations": true },
            "apps/memoir-server": { "checkMigrations": true },
            "apps/synapse-server": { "checkMigrations": true },
            "apps/web-novel-server": { "checkMigrations": true }
          }
          JSON

          # Emit matrix.include directly: a static `include:` keyed by workspace name would re-add every unaffected workspace as its own job,
          # because unmatched include entries become new combinations.
          # checkApiTypes runs on both legs of every apps/*-server and apps/*-web pair, so a web-only hand edit of api-types.gen.ts is caught too.
          MATRIX="$(jq -cn --argjson meta "$(cat /tmp/workspace-metadata.json)" --argjson selected "$SELECTED_JSON" '
            $selected | map(
              . as $w
              | ($meta[$w] // {}) as $m
              | {
                  workspace: $w,
                  checkMigrations: ($m.checkMigrations // false),
                  checkApiTypes: (($w | test("^apps/.*-(server|web)$")) and ($m.checkApiTypes != false)),
                  checkClients: ($w | test("^(apps/.*-server|packages/clients)$"))
                }
            )
          ')"

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Resolved matrix:"
          echo "$MATRIX" | jq .

  verify:
    name: verify (${{ matrix.workspace }})
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # No max-parallel: the repo is public, so GitHub-hosted runners allow more concurrent jobs than the matrix produces.
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The key covers every input of every package build, so a miss must build the FULL package set; a closure-only build would save a partial dist set under the shared key.
      - name: Restore built package dists
        id: pkgdist
        if: matrix.workspace != 'scripts' && matrix.workspace != 'e2e'
        uses: actions/cache@v4
        with:
          path: packages/*/dist
          key: pkgdist-${{ runner.os }}-${{ hashFiles('packages/*/src/**', 'packages/*/package.json', 'packages/*/tsconfig*.json', 'packages/*/README.md', 'packages/tsconfig.lib.json', 'packages/tsconfig.build.json', 'bun.lock', 'package.json', 'tsconfig.base.json', 'types/**', 'scripts/**') }}

      - name: Build packages
        if: matrix.workspace != 'scripts' && matrix.workspace != 'e2e' && steps.pkgdist.outputs.cache-hit != 'true'
        run: bun scripts/build.ts 'packages/*'

      # Diffs `drizzle-kit generate` output against the committed migrations; no live database needed.
      - name: Check migrations
        if: matrix.checkMigrations
        run: bun scripts/check-migrations.ts ${{ matrix.workspace }}

      # The test step runs only where the workspace opts in via `"shadow": { "verifyTest": true }`; e2e needs a live deployment and does not.
      # `--ci` fails an apps/* test over the 50ms hard cap instead of only warning.
      - name: Verify
        run: bun scripts/verify.ts ${{ matrix.workspace }} --ci

      # The server-web contract is not atomic, so drift in a committed api-types.gen.ts is otherwise silent;
      # --check boots the server's `src/dump-openapi.ts` over fakes, with no infra.
      - name: Check API types
        if: matrix.checkApiTypes
        run: bun scripts/gen-api-types.ts "$(echo '${{ matrix.workspace }}' | sed 's/-server$/-web/')" --check

      # A server's leg checks the client contracts cut from it; the package's leg checks them all, so a hand edit of a generated contract is caught too.
      - name: Check service client contracts
        if: matrix.checkClients
        run: bun scripts/gen-clients.ts ${{ matrix.workspace }} --check

      - name: Build
        if: matrix.workspace != 'scripts'
        run: bun scripts/build.ts ${{ matrix.workspace }}

  # Whole-repo by nature (an export is unused only once every workspace is read), so it runs on every change rather than per affected workspace.
  code-health:
    name: code-health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # knip, jscpd and madge run under Node, and knip.config.ts needs `fs.globSync` (Node 22+), newer than the runner image's default Node.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # knip loads each web app's vite.config.ts, which imports the built `@shadow-library/web`; same key as the verify job, so the full set is built on a miss.
      - name: Restore built package dists
        id: pkgdist
        uses: actions/cache@v4
        with:
          path: packages/*/dist
          key: pkgdist-${{ runner.os }}-${{ hashFiles('packages/*/src/**', 'packages/*/package.json', 'packages/*/tsconfig*.json', 'packages/*/README.md', 'packages/tsconfig.lib.json', 'packages/tsconfig.build.json', 'bun.lock', 'package.json', 'tsconfig.base.json', 'types/**', 'scripts/**') }}

      - name: Build packages
        if: steps.pkgdist.outputs.cache-hit != 'true'
        run: bun scripts/build.ts 'packages/*'

      - name: Code health
        run: bun scripts/code-health.ts

  # Required-status-check target: a zero-leg matrix reports "skipped", so a check pinned to `verify` would wait forever. This job always runs and normalizes that.
  ci:
    name: CI
    needs: [changes, verify, code-health]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # verify may be skipped only because `changes` succeeded with an empty matrix; a failed `changes` also skips it, so `changes` must succeed.
      - name: Require changes and code-health to have succeeded, and verify to have succeeded or been legitimately skipped
        run: |
          changes="${{ needs.changes.result }}"
          verify="${{ needs.verify.result }}"
          health="${{ needs.code-health.result }}"
          echo "changes result: $changes, verify result: $verify, code-health result: $health"
          if [ "$changes" != "success" ] || [ "$verify" = "failure" ] || [ "$verify" = "cancelled" ] || [ "$health" != "success" ]; then
            exit 1
          fi
